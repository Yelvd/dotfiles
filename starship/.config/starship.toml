# ~/.config/starship.toml  (plain layout, Catppuccin Macchiato colors)
#
#   dotfiles/nvim on  master [!?] took 3s
#   ❯

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"
add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold lavender"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
style = "bold mauve"
symbol = " "

[git_status]
style = "bold red"

[cmd_duration]
style = "bold yellow"
min_time = 2_000

[username]
style_user = "bold sapphire"
style_root = "bold red"

[hostname]
style = "bold sapphire"

[python]
style = "bold yellow"

[nodejs]
style = "bold green"

[rust]
style = "bold peach"

[golang]
style = "bold sapphire"

[lua]
style = "bold blue"

[package]
style = "bold peach"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
