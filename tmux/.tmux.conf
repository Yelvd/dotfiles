# --- colors: true color so themes look right inside tmux ---------------------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"

# undercurl + colored underlines (for LazyVim error squiggles)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- sensible defaults --------------------------------------------------------
set -g mouse on
set -g base-index 1                 # windows start at 1, easier to reach
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10              # no lag on <Esc> in neovim
set -g focus-events on              # lets neovim reload files on focus

# Split panes in the current directory with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# --- theme: Catppuccin --------------------------------------------------------
# Install once:
#   git clone -b v2.1.3 https://github.com/catppuccin/tmux.git ~/.config/tmux/plugins/catppuccin/tmux
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Status bar (must come after the `run` line above)
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# --- jump between commands in the scrollback ---------------------------------
# Needs the prompt markers from ~/.config/zsh/catppuccin.zsh (tmux 3.4+).
setw -g mode-keys vi
# prefix + u: scroll up to the first line of the last command's output
bind u copy-mode \; send -X previous-prompt -o
# In copy mode: [ and ] jump to the previous / next command
bind -T copy-mode-vi [ send -X previous-prompt -o
bind -T copy-mode-vi ] send -X next-prompt -o
